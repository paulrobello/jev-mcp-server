# Pre-commit hooks for systemone-mcp-server
# Install: pre-commit install
# Run manually: make pre-commit
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: local
    hooks:
      - id: biome-fmt
        name: make fmt-check (biome format check)
        entry: make fmt-check
        language: system
        types_or: [ts, json]
        pass_filenames: false
      - id: biome-lint
        name: make lint (biome check)
        entry: make lint
        language: system
        types_or: [ts, json]
        pass_filenames: false
      - id: tsc-typecheck
        name: make typecheck (tsc --noEmit)
        entry: make typecheck
        language: system
        types: [ts]
        pass_filenames: false
      - id: bun-test
        name: make test (bun test)
        entry: make test
        language: system
        types: [ts]
        pass_filenames: false
